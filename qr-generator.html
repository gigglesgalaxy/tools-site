<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — GigglesGalaxy Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;--accent:#6c63ff;--text:#e8e8f0;--muted:#7070a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  header{background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--text);}
  .logo span{color:var(--accent);}
  .back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;transition:color 0.2s;}
  .back-btn:hover{color:var(--accent);}
  main{max-width:640px;margin:0 auto;padding:60px 24px;position:relative;z-index:1;}
  h1{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;margin-bottom:8px;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:40px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
  .tab{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;font-family:inherit;font-size:0.83rem;color:var(--muted);transition:all 0.2s;}
  .tab.active,.tab:hover{border-color:var(--accent);color:var(--accent);}
  label{display:block;font-size:0.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;margin-top:16px;}
  input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);font-family:inherit;font-size:0.95rem;outline:none;transition:border-color 0.2s;}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  .btn{width:100%;background:linear-gradient(135deg,var(--accent),#a855f7);border:none;border-radius:12px;padding:16px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:transform 0.15s;margin-top:20px;}
  .btn:hover{transform:translateY(-2px);}
  .qr-container{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:32px;}
  #qrcode{background:#fff;padding:20px;border-radius:16px;display:none;}
  #qrcode canvas,#qrcode img{display:block;}
  .dl-btn{background:var(--accent);border:none;border-radius:10px;padding:12px 28px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;font-size:0.9rem;transition:opacity 0.2s;display:none;}
  .dl-btn:hover{opacity:0.85;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Giggles<span>Galaxy</span> Tools</a>
  <a class="back-btn" href="index.html">← All Tools</a>
</header>
<main>
  <h1>📱 QR Code <span>Generator</span></h1>
  <p class="subtitle">Create QR codes for URLs, text, WiFi and more. Download instantly.</p>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="setType('url',this)">🔗 URL</button>
      <button class="tab" onclick="setType('text',this)">📝 Text</button>
      <button class="tab" onclick="setType('wifi',this)">📶 WiFi</button>
      <button class="tab" onclick="setType('email',this)">✉️ Email</button>
      <button class="tab" onclick="setType('phone',this)">📞 Phone</button>
    </div>

    <div id="urlForm">
      <label>Website URL</label>
      <input type="url" id="urlInput" placeholder="https://example.com">
    </div>
    <div id="textForm" style="display:none">
      <label>Your Text</label>
      <textarea id="textInput" rows="4" placeholder="Enter any text..."></textarea>
    </div>
    <div id="wifiForm" style="display:none">
      <label>Network Name (SSID)</label>
      <input type="text" id="wifiSSID" placeholder="MyWifi">
      <label>Password</label>
      <input type="password" id="wifiPass" placeholder="password">
      <label>Security</label>
      <select id="wifiSec"><option>WPA</option><option>WEP</option><option>nopass</option></select>
    </div>
    <div id="emailForm" style="display:none">
      <label>Email Address</label>
      <input type="email" id="emailAddr" placeholder="user@example.com">
      <label>Subject (optional)</label>
      <input type="text" id="emailSubj" placeholder="Hello there">
    </div>
    <div id="phoneForm" style="display:none">
      <label>Phone Number</label>
      <input type="tel" id="phoneNum" placeholder="+1234567890">
    </div>

    <button class="btn" onclick="generateQR()">Generate QR Code</button>

    <div class="qr-container">
      <div id="qrcode"></div>
      <button class="dl-btn" id="dlBtn" onclick="downloadQR()">⬇ Download PNG</button>
    </div>
  </div>
</main>
<script>
let currentType = 'url';
let qr = null;

function setType(type, btn){
  currentType = type;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['urlForm','textForm','wifiForm','emailForm','phoneForm'].forEach(id=>{
    document.getElementById(id).style.display='none';
  });
  document.getElementById(type+'Form').style.display='block';
}

function getContent(){
  if(currentType==='url') return document.getElementById('urlInput').value||'https://gigglesgalaxy.com';
  if(currentType==='text') return document.getElementById('textInput').value||'Hello from GigglesGalaxy!';
  if(currentType==='wifi'){
    const ssid=document.getElementById('wifiSSID').value;
    const pass=document.getElementById('wifiPass').value;
    const sec=document.getElementById('wifiSec').value;
    return `WIFI:T:${sec};S:${ssid};P:${pass};;`;
  }
  if(currentType==='email'){
    const addr=document.getElementById('emailAddr').value;
    const subj=document.getElementById('emailSubj').value;
    return `mailto:${addr}${subj?'?subject='+encodeURIComponent(subj):''}`;
  }
  if(currentType==='phone') return 'tel:'+document.getElementById('phoneNum').value;
  return '';
}

function generateQR(){
  const content = getContent();
  const container = document.getElementById('qrcode');
  container.innerHTML = '';
  if(qr){qr=null;}
  qr = new QRCode(container, {
    text: content,
    width: 256, height: 256,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  container.style.display='block';
  document.getElementById('dlBtn').style.display='block';
}

function downloadQR(){
  const canvas = document.querySelector('#qrcode canvas');
  if(canvas){
    const link=document.createElement('a');
    link.download='qrcode.png';
    link.href=canvas.toDataURL();
    link.click();
  }
}
</script>
</body>
</html>
