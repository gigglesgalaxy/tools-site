<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorem Ipsum Generator — GigglesGalaxy Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;--accent:#6c63ff;--text:#e8e8f0;--muted:#7070a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  header{background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--text);}
  .logo span{color:var(--accent);}
  .back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;}
  .back-btn:hover{color:var(--accent);}
  main{max-width:750px;margin:0 auto;padding:60px 24px;}
  h1{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;margin-bottom:8px;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:40px;}
  .controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;margin-bottom:24px;}
  .ctrl-group{display:flex;flex-direction:column;gap:8px;}
  label{font-size:0.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}
  input[type=number]{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:1rem;outline:none;width:80px;transition:border-color 0.2s;}
  input[type=number]:focus{border-color:var(--accent);}
  select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none;cursor:pointer;}
  .checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:0.83rem;}
  .checkbox-row input{accent-color:var(--accent);}
  .btn{background:linear-gradient(135deg,var(--accent),#a855f7);border:none;border-radius:12px;padding:13px 24px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;font-size:0.95rem;white-space:nowrap;align-self:flex-end;transition:transform 0.15s;}
  .btn:hover{transform:translateY(-2px);}
  .output-wrap{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;}
  .output-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);}
  .output-bar span{color:var(--muted);font-size:0.83rem;}
  .copy-btn{background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.3);color:var(--accent);border-radius:8px;padding:7px 16px;cursor:pointer;font-family:inherit;font-size:0.82rem;transition:all 0.2s;}
  .copy-btn:hover{background:var(--accent);color:#fff;}
  .output-text{padding:28px;line-height:1.8;font-size:0.95rem;color:var(--text);max-height:500px;overflow-y:auto;white-space:pre-wrap;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Giggles<span>Galaxy</span> Tools</a>
  <a class="back-btn" href="index.html">← All Tools</a>
</header>
<main>
  <h1>📄 Lorem Ipsum <span>Generator</span></h1>
  <p class="subtitle">Generate placeholder text for designs, mockups and development</p>

  <div class="controls">
    <div class="ctrl-group">
      <label>Amount</label>
      <input type="number" id="amount" value="3" min="1" max="50">
    </div>
    <div class="ctrl-group">
      <label>Type</label>
      <select id="type">
        <option value="paragraphs">Paragraphs</option>
        <option value="sentences">Sentences</option>
        <option value="words">Words</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>Start With</label>
      <select id="startWith">
        <option value="lorem">Lorem ipsum...</option>
        <option value="random">Random start</option>
      </select>
    </div>
    <label class="checkbox-row"><input type="checkbox" id="html"> HTML &lt;p&gt; tags</label>
    <button class="btn" onclick="generate()">Generate</button>
  </div>

  <div class="output-wrap">
    <div class="output-bar">
      <span id="outputInfo">0 words · 0 chars</span>
      <button class="copy-btn" onclick="copyOutput()">📋 Copy All</button>
    </div>
    <div class="output-text" id="outputText"></div>
  </div>
</main>
<script>
const loremWords=['lorem','ipsum','dolor','sit','amet','consectetur','adipiscing','elit','sed','do','eiusmod','tempor','incididunt','ut','labore','et','dolore','magna','aliqua','enim','ad','minim','veniam','quis','nostrud','exercitation','ullamco','laboris','nisi','aliquip','commodo','consequat','duis','aute','irure','in','reprehenderit','voluptate','velit','esse','cillum','eu','fugiat','nulla','pariatur','excepteur','sint','occaecat','cupidatat','non','proident','sunt','culpa','qui','officia','deserunt','mollit','anim','id','est','laborum','praesent','commodo','cursus','magna','vel','scelerisque','nisl','malesuada','proin','fermentum','leo','vel','orci','porta','non','pulvinar','neque','laoreet','suspendisse','interdum','consectetur','libero','id','faucibus','nisl','tincidunt','eget','nullam','ac','tortor','vitae','purus','faucibus','ornare','suspendisse','sed','nisi','lacus','sed','viverra','tellus','in','hac','habitasse','platea','dictumst'];

function randWord(){return loremWords[Math.floor(Math.random()*loremWords.length)];}
function randSentence(numWords=null){
  const n=numWords||(8+Math.floor(Math.random()*10));
  const words=Array.from({length:n},(_,i)=>i===0?randWord().charAt(0).toUpperCase()+randWord().slice(1):randWord());
  return words.join(' ')+'.';}
function randParagraph(){
  const n=4+Math.floor(Math.random()*4);
  return Array.from({length:n},()=>randSentence()).join(' ');}

function generate(){
  const amount=parseInt(document.getElementById('amount').value)||3;
  const type=document.getElementById('type').value;
  const useHtml=document.getElementById('html').checked;
  const startLorem=document.getElementById('startWith').value==='lorem';

  let pieces=[];
  if(type==='paragraphs'){
    for(let i=0;i<amount;i++){
      let p=randParagraph();
      if(i===0&&startLorem) p='Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. '+p;
      pieces.push(useHtml?`<p>${p}</p>`:p);
    }
  } else if(type==='sentences'){
    for(let i=0;i<amount;i++){
      let s=randSentence();
      if(i===0&&startLorem) s='Lorem ipsum dolor sit amet, consectetur adipiscing elit.';
      pieces.push(s);
    }
  } else {
    const words=Array.from({length:amount},(_,i)=>{
      if(i===0&&startLorem) return 'Lorem';
      return randWord();
    });
    pieces=[words.join(' ')+(useHtml?'':'')];
  }

  const output=pieces.join(useHtml?'\n\n':'\n\n');
  document.getElementById('outputText').textContent=output;
  const wordCount=output.replace(/<[^>]*>/g,'').trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('outputInfo').textContent=`${wordCount} words · ${output.length} chars`;
}

generate();
function copyOutput(){
  navigator.clipboard.writeText(document.getElementById('outputText').textContent);
  const btn=document.querySelector('.copy-btn');
  btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent='📋 Copy All',1500);
}
</script>
</body></html>
