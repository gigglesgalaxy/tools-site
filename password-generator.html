<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — GigglesGalaxy Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;--accent:#6c63ff;--accent2:#43e97b;--accent3:#ff6584;--text:#e8e8f0;--muted:#7070a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 70%,rgba(67,233,123,0.05) 0%,transparent 60%);pointer-events:none;}
  header{background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--text);}
  .logo span{color:var(--accent);}
  .back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;transition:color 0.2s;}
  .back-btn:hover{color:var(--accent);}
  main{max-width:600px;margin:0 auto;padding:60px 24px;position:relative;z-index:1;}
  h1{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;margin-bottom:8px;}
  h1 span{color:var(--accent2);}
  .subtitle{color:var(--muted);margin-bottom:40px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px;margin-bottom:24px;}
  .password-display{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
  #pwText{font-family:'Courier New',monospace;font-size:1.1rem;word-break:break-all;flex:1;color:var(--accent2);}
  .copy-btn{background:rgba(67,233,123,0.15);border:1px solid rgba(67,233,123,0.3);color:var(--accent2);border-radius:8px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:0.85rem;white-space:nowrap;transition:all 0.2s;}
  .copy-btn:hover{background:var(--accent2);color:#000;}
  .strength-bar{height:6px;border-radius:3px;background:var(--border);margin-bottom:8px;overflow:hidden;}
  .strength-fill{height:100%;border-radius:3px;transition:width 0.4s,background 0.4s;}
  .strength-label{font-size:0.8rem;color:var(--muted);margin-bottom:20px;}
  label{display:block;font-size:0.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
  .range-row{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  input[type=range]{flex:1;accent-color:var(--accent);}
  .range-val{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-family:'Syne',sans-serif;font-weight:700;color:var(--accent);min-width:50px;text-align:center;}
  .checkboxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
  .checkbox-row{display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:border-color 0.2s;}
  .checkbox-row:hover{border-color:var(--accent);}
  .checkbox-row input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;}
  .checkbox-row span{font-size:0.85rem;}
  .btn{width:100%;background:linear-gradient(135deg,var(--accent),#a855f7);border:none;border-radius:12px;padding:16px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:transform 0.15s;}
  .btn:hover{transform:translateY(-2px);}
  .history{margin-top:12px;}
  .hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);margin-bottom:8px;font-family:'Courier New',monospace;font-size:0.85rem;}
  .hist-copy{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 8px;font-size:0.75rem;transition:color 0.2s;}
  .hist-copy:hover{color:var(--accent);}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Giggles<span>Galaxy</span> Tools</a>
  <a class="back-btn" href="index.html">← All Tools</a>
</header>
<main>
  <h1>🔐 Password <span>Generator</span></h1>
  <p class="subtitle">Create strong, secure passwords with custom options</p>

  <div class="card">
    <div class="password-display">
      <div id="pwText">Click Generate!</div>
      <button class="copy-btn" onclick="copyPassword()">📋 Copy</button>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0%"></div></div>
    <div class="strength-label" id="strengthLabel">Strength: —</div>

    <label>Password Length: <span id="lenDisplay">16</span></label>
    <div class="range-row">
      <input type="range" id="length" min="6" max="64" value="16" oninput="document.getElementById('lenDisplay').textContent=this.value;generate()">
      <div class="range-val" id="lenVal">16</div>
    </div>

    <label>Include</label>
    <div class="checkboxes">
      <label class="checkbox-row"><input type="checkbox" id="upper" checked onchange="generate()"><span>Uppercase A-Z</span></label>
      <label class="checkbox-row"><input type="checkbox" id="lower" checked onchange="generate()"><span>Lowercase a-z</span></label>
      <label class="checkbox-row"><input type="checkbox" id="numbers" checked onchange="generate()"><span>Numbers 0-9</span></label>
      <label class="checkbox-row"><input type="checkbox" id="symbols" onchange="generate()"><span>Symbols !@#$</span></label>
      <label class="checkbox-row"><input type="checkbox" id="noambig" onchange="generate()"><span>Exclude 0,O,l,I</span></label>
      <label class="checkbox-row"><input type="checkbox" id="memorable" onchange="generate()"><span>Memorable Words</span></label>
    </div>
    <button class="btn" onclick="generate()">⚡ Generate New Password</button>
  </div>

  <div class="card">
    <label>Recent Passwords</label>
    <div class="history" id="history"><p style="color:var(--muted);font-size:0.85rem">Generate some passwords to see history here.</p></div>
  </div>
</main>

<script>
const history = [];
const words = ['apple','brave','cloud','dance','eagle','flame','grace','honey','ivory','jolly','karma','lemon','magic','noble','ocean','power','quest','radio','storm','tiger','ultra','venus','water','xenon','yacht','zebra'];

function generate(){
  const len = parseInt(document.getElementById('length').value);
  document.getElementById('lenDisplay').textContent = len;
  document.getElementById('lenVal').textContent = len;
  
  if(document.getElementById('memorable').checked){
    const w1=words[Math.floor(Math.random()*words.length)];
    const w2=words[Math.floor(Math.random()*words.length)];
    const w3=words[Math.floor(Math.random()*words.length)];
    const n=Math.floor(Math.random()*999);
    const pw=w1.charAt(0).toUpperCase()+w1.slice(1)+'-'+w2+'-'+w3+n;
    setPassword(pw);return;
  }

  let chars='';
  if(document.getElementById('upper').checked) chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('lower').checked) chars+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('numbers').checked) chars+='0123456789';
  if(document.getElementById('symbols').checked) chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(document.getElementById('noambig').checked) chars=chars.replace(/[0Ol1I]/g,'');
  if(!chars){document.getElementById('pwText').textContent='Select at least one option!';return;}

  let pw='';
  for(let i=0;i<len;i++) pw+=chars[Math.floor(Math.random()*chars.length)];
  setPassword(pw);
}

function setPassword(pw){
  document.getElementById('pwText').textContent=pw;
  
  // Strength
  let score=0;
  if(pw.length>=8)score++;if(pw.length>=12)score++;if(pw.length>=16)score++;
  if(/[A-Z]/.test(pw))score++;if(/[a-z]/.test(pw))score++;
  if(/[0-9]/.test(pw))score++;if(/[^A-Za-z0-9]/.test(pw))score++;
  const labels=[['Weak','#ef4444'],['Fair','#f97316'],['Good','#eab308'],['Strong','#22c55e'],['Very Strong','#43e97b']];
  const idx=Math.min(Math.floor(score/1.5),4);
  document.getElementById('strengthFill').style.width=((score/7)*100)+'%';
  document.getElementById('strengthFill').style.background=labels[idx][1];
  document.getElementById('strengthLabel').textContent='Strength: '+labels[idx][0];

  // History
  if(history.length===0||history[0]!==pw){
    history.unshift(pw);
    if(history.length>5)history.pop();
    renderHistory();
  }
}

function renderHistory(){
  const h=document.getElementById('history');
  h.innerHTML=history.map((p,i)=>`
    <div class="hist-item">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px">${p}</span>
      <button class="hist-copy" onclick="navigator.clipboard.writeText('${p}')">Copy</button>
    </div>`).join('');
}

function copyPassword(){
  const pw=document.getElementById('pwText').textContent;
  if(pw&&pw!=='Click Generate!'&&pw!=='Select at least one option!'){
    navigator.clipboard.writeText(pw);
    const btn=document.querySelector('.copy-btn');
    btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent='📋 Copy',1500);
  }
}

generate();
</script>
</body>
</html>
