<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker — GigglesGalaxy Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;--accent:#6c63ff;--text:#e8e8f0;--muted:#7070a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  header{background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--text);}
  .logo span{color:var(--accent);}
  .back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;}
  .back-btn:hover{color:var(--accent);}
  main{max-width:700px;margin:0 auto;padding:60px 24px;}
  h1{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;margin-bottom:8px;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:40px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px;margin-bottom:20px;}
  .picker-wrap{display:flex;align-items:center;gap:24px;margin-bottom:28px;}
  input[type=color]{width:100px;height:100px;border:none;border-radius:16px;cursor:pointer;background:none;padding:0;}
  .color-preview{flex:1;height:100px;border-radius:16px;transition:background 0.2s;}
  .values-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  .val-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
  .val-box .k{color:var(--muted);font-size:0.78rem;font-weight:600;text-transform:uppercase;}
  .val-box .v{font-family:'Syne',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;transition:color 0.2s;}
  .val-box .v:hover{color:var(--accent);}
  .section-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--muted);}
  .palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .swatch{height:56px;border-radius:12px;cursor:pointer;transition:transform 0.15s;border:2px solid transparent;}
  .swatch:hover{transform:scale(1.05);border-color:rgba(255,255,255,0.3);}
  .swatch-label{text-align:center;font-size:0.7rem;color:var(--muted);margin-top:4px;}
  .hex-input{display:flex;gap:10px;margin-bottom:20px;}
  .hex-input input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 18px;color:var(--text);font-family:'Courier New',monospace;font-size:1rem;outline:none;transition:border-color 0.2s;}
  .hex-input input:focus{border-color:var(--accent);}
  .hex-input button{background:var(--accent);border:none;border-radius:12px;padding:12px 20px;color:#fff;font-family:inherit;font-weight:600;cursor:pointer;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#43e97b;color:#000;font-weight:600;padding:10px 24px;border-radius:50px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Giggles<span>Galaxy</span> Tools</a>
  <a class="back-btn" href="index.html">← All Tools</a>
</header>
<main>
  <h1>🎨 Color <span>Picker</span></h1>
  <p class="subtitle">Pick colors and get HEX, RGB, HSL values. Generate palettes.</p>

  <div class="card">
    <div class="hex-input">
      <input type="text" id="hexInput" placeholder="#6c63ff" maxlength="7">
      <button onclick="applyHex()">Apply</button>
    </div>
    <div class="picker-wrap">
      <input type="color" id="colorPicker" value="#6c63ff" oninput="updateColor(this.value)">
      <div class="color-preview" id="colorPreview" style="background:#6c63ff"></div>
    </div>
    <div class="values-grid">
      <div class="val-box"><span class="k">HEX</span><span class="v" id="vHex" onclick="copyVal(this)">#6C63FF</span></div>
      <div class="val-box"><span class="k">RGB</span><span class="v" id="vRgb" onclick="copyVal(this)">108, 99, 255</span></div>
      <div class="val-box"><span class="k">HSL</span><span class="v" id="vHsl" onclick="copyVal(this)">244°, 100%, 69%</span></div>
      <div class="val-box"><span class="k">HSV</span><span class="v" id="vHsv" onclick="copyVal(this)">244°, 61%, 100%</span></div>
      <div class="val-box"><span class="k">CSS</span><span class="v" id="vCss" onclick="copyVal(this)" style="font-size:0.78rem">rgb(108, 99, 255)</span></div>
      <div class="val-box"><span class="k">Luminance</span><span class="v" id="vLum" onclick="copyVal(this)">0.17</span></div>
    </div>
    <p style="color:var(--muted);font-size:0.78rem;margin-bottom:20px;">Click any value to copy</p>
  </div>

  <div class="card">
    <div class="section-title">Generated Palette</div>
    <div class="palette-grid" id="palette"></div>
  </div>
</main>
<div class="toast" id="toast">✓ Copied!</div>

<script>
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b};}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h;const s=max===0?0:d/max,v=max;if(max===min)h=0;else{switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}}return{h:Math.round(h*360),s:Math.round(s*100),v:Math.round(v*100)};}
function luminance(r,g,b){const [rs,gs,bs]=[r,g,b].map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return(0.2126*rs+0.7152*gs+0.0722*bs).toFixed(3);}

function updateColor(hex){
  if(!/^#[0-9A-Fa-f]{6}$/.test(hex))return;
  document.getElementById('colorPreview').style.background=hex;
  document.getElementById('hexInput').value=hex;
  const{r,g,b}=hexToRgb(hex);
  const{h,s,l}=rgbToHsl(r,g,b);
  const hsv=rgbToHsv(r,g,b);
  document.getElementById('vHex').textContent=hex.toUpperCase();
  document.getElementById('vRgb').textContent=`${r}, ${g}, ${b}`;
  document.getElementById('vHsl').textContent=`${h}°, ${s}%, ${l}%`;
  document.getElementById('vHsv').textContent=`${hsv.h}°, ${hsv.s}%, ${hsv.v}%`;
  document.getElementById('vCss').textContent=`rgb(${r}, ${g}, ${b})`;
  document.getElementById('vLum').textContent=luminance(r,g,b);
  generatePalette(hex,h,s,l);
}

function generatePalette(base,h,s,l){
  const shades=[90,75,60,50,40,25,15,5].map(ll=>{
    const c=hslToHex(h,s,ll);
    return`<div><div class="swatch" style="background:${c}" onclick="document.getElementById('colorPicker').value='${c}';updateColor('${c}')" title="${c}"></div><div class="swatch-label">${c}</div></div>`;
  });
  // Complementary, analogous
  const comp=hslToHex((h+180)%360,s,l);
  const ana1=hslToHex((h+30)%360,s,l);
  const tri=hslToHex((h+120)%360,s,l);
  const extras=[comp,ana1,tri].map(c=>`<div><div class="swatch" style="background:${c}" onclick="document.getElementById('colorPicker').value='${c}';updateColor('${c}')" title="${c}"></div><div class="swatch-label">${c}</div></div>`);
  document.getElementById('palette').innerHTML=[...shades,...extras].join('');
}

function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');};return`#${f(0)}${f(8)}${f(4)}`;}

function applyHex(){
  let v=document.getElementById('hexInput').value.trim();
  if(!v.startsWith('#'))v='#'+v;
  if(/^#[0-9A-Fa-f]{6}$/.test(v)){document.getElementById('colorPicker').value=v;updateColor(v);}
}

function copyVal(el){navigator.clipboard.writeText(el.textContent);const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}

updateColor('#6c63ff');
</script>
</body></html>
