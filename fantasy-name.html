<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Name Generator — GigglesGalaxy Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;--accent:#6c63ff;--accent2:#ff6584;--accent3:#43e97b;--text:#e8e8f0;--muted:#7070a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(108,99,255,0.1) 0%,transparent 60%);pointer-events:none;}
  header{background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--text);}
  .logo span{color:var(--accent);}
  .back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;transition:color 0.2s;}
  .back-btn:hover{color:var(--accent);}
  main{max-width:860px;margin:0 auto;padding:60px 24px;position:relative;z-index:1;}
  h1{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;margin-bottom:8px;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:40px;}
  .race-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:32px;}
  .race-btn{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;transition:all 0.2s;font-family:inherit;color:var(--text);}
  .race-btn:hover,.race-btn.active{border-color:var(--accent);background:rgba(108,99,255,0.1);color:var(--accent);}
  .race-btn .emoji{font-size:1.8rem;display:block;margin-bottom:6px;}
  .race-btn .name{font-size:0.82rem;font-weight:600;}
  .controls{display:flex;gap:16px;align-items:center;margin-bottom:32px;flex-wrap:wrap;}
  .gender-select{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none;cursor:pointer;}
  .count-select{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none;cursor:pointer;}
  .gen-btn{background:linear-gradient(135deg,var(--accent),#a855f7);border:none;border-radius:12px;padding:13px 28px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:transform 0.15s;}
  .gen-btn:hover{transform:translateY(-2px);}
  .names-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .name-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;transition:all 0.2s;cursor:pointer;}
  .name-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .name-card .name{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:4px;}
  .name-card .meaning{color:var(--muted);font-size:0.78rem;}
  .name-card .copy-hint{color:var(--accent);font-size:0.72rem;margin-top:8px;opacity:0;}
  .name-card:hover .copy-hint{opacity:1;}
  .copied-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent3);color:#000;font-weight:600;padding:10px 24px;border-radius:50px;font-size:0.9rem;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;}
  .copied-toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Giggles<span>Galaxy</span> Tools</a>
  <a class="back-btn" href="index.html">← All Tools</a>
</header>
<main>
  <h1>🧙 Fantasy <span>Name Generator</span></h1>
  <p class="subtitle">Generate epic names for your fantasy characters — RPGs, D&D, novels & more</p>

  <div class="race-grid" id="raceGrid"></div>

  <div class="controls">
    <select class="gender-select" id="gender">
      <option value="any">Any Gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>
    <select class="count-select" id="count">
      <option value="8">8 Names</option>
      <option value="12" selected>12 Names</option>
      <option value="20">20 Names</option>
    </select>
    <button class="gen-btn" onclick="generate()">⚡ Generate Names</button>
  </div>

  <div class="names-grid" id="namesGrid"></div>
</main>
<div class="copied-toast" id="toast">✓ Name copied!</div>

<script>
const races = [
  {id:'elf',emoji:'🧝',name:'Elf',
    m:['Aelthas','Caladrel','Erevann','Falcoran','Galadwen','Ioreth','Lúthien','Míriel','Oronar','Taliesin','Valandil','Celeborn','Elrohir','Glorfindel','Rúmil','Thranduil'],
    f:['Ariel','Caladwen','Elara','Faelwen','Galadriel','Iolanthe','Laeralei','Miravel','Nymeria','Sariel','Tiriel','Valarei','Aelindra','Calyphin','Eryniel','Faelindra'],
    meanings:['silver song','moon dancer','star watcher','forest singer','dawn light','eternal grace','shadow walker','wind whisperer']},
  {id:'dwarf',emoji:'⛏️',name:'Dwarf',
    m:['Balin','Bifur','Bofur','Bombur','Dain','Dori','Durin','Fili','Gimli','Gloin','Kili','Nori','Oin','Thorin','Dwalin','Ori'],
    f:['Bryn','Dis','Dolly','Fulla','Hilda','Ingrid','Marta','Nori','Sigrid','Tilda','Ulfhild','Vigdis','Astrid','Bergit','Dagny','Gunhild'],
    meanings:['stone breaker','iron fist','gold digger','mountain king','forge master','deep delver']},
  {id:'orc',emoji:'💀',name:'Orc',
    m:['Azog','Bolg','Gortash','Grish','Karg','Mog','Norg','Rugash','Shag','Thrak','Ugluk','Vorag','Zaruk','Gromm','Krak','Snorr'],
    f:['Basha','Dasha','Gorka','Gruna','Kasha','Mirka','Narga','Rasha','Shura','Tarka','Uga','Varka','Wenda','Yarga','Zasha','Durka'],
    meanings:['blood drinker','skull crusher','war chief','death bringer','iron hide','battle scar']},
  {id:'viking',emoji:'⚔️',name:'Viking',
    m:['Bjorn','Erik','Gunnar','Halfdan','Harald','Ivar','Leif','Magnus','Ragnar','Sigurd','Sven','Thorvald','Ulf','Valgard','Wolfram','Yngvar'],
    f:['Astrid','Brynhild','Freydis','Gudrun','Helga','Ingrid','Ragnhild','Sigrid','Thora','Unn','Valdis','Vigdis','Ylva','Asgerd','Bergljot','Dagrun'],
    meanings:['sea wolf','thunder striker','shield maiden','raven lord','frost giant','storm rider']},
  {id:'wizard',emoji:'🔮',name:'Wizard',
    m:['Aldric','Balthazar','Cornelius','Dorian','Ezra','Faustus','Gideon','Hadrian','Isidore','Jasper','Kellian','Lysander','Malachar','Nicodeus','Orpheus','Ptolemy'],
    f:['Aelara','Brexia','Celeste','Delphine','Elysia','Fayre','Gemini','Hexara','Isolde','Jubilee','Kira','Lyra','Mirena','Nerida','Orinthia','Phaedra'],
    meanings:['arcane seeker','spell weaver','time bender','star caller','void walker','rune keeper']},
  {id:'vampire',emoji:'🧛',name:'Vampire',
    m:['Alaric','Bastian','Caius','Dracul','Emeric','Florin','Gavril','Hektor','Isidor','Jacek','Lazlo','Mircea','Nikolaj','Octavian','Radu','Valerian'],
    f:['Anya','Bianca','Carmilla','Daciana','Elvira','Florinca','Genoveva','Ileana','Luminița','Mirela','Natasha','Petra','Renata','Sorina','Tatiana','Valentina'],
    meanings:['lord of night','blood eternal','shadow born','moonchild','crimson tide','death kiss']},
  {id:'dragon',emoji:'🐉',name:'Dragonborn',
    m:['Arjhan','Balasar','Bharash','Donaar','Ghesh','Heskan','Kriv','Medrash','Mehen','Nadarr','Pandjed','Patrin','Rhogar','Shamash','Shedinn','Torinn'],
    f:['Akra','Biri','Daar','Farideh','Harann','Havilar','Jheri','Kava','Korinn','Mishann','Nala','Perra','Raiann','Sora','Surina','Thava'],
    meanings:['flame tongue','scale master','sky terror','ancient fire','iron wing','ember born']},
  {id:'halfling',emoji:'🍀',name:'Halfling',
    m:['Alton','Ander','Cade','Corrin','Eldon','Garret','Lindal','Lyle','Merric','Milo','Osborn','Perrin','Reed','Roscoe','Well','Wendell'],
    f:['Andry','Bree','Callie','Cora','Euphemia','Jillian','Kithri','Lavinia','Lidda','Merla','Nedda','Paela','Portia','Seraphina','Shaena','Trym'],
    meanings:['lucky clover','soft step','merry heart','bright smile','quick foot','pipe smoker']},
];

let selectedRace = races[0];

function renderRaces(){
  const g = document.getElementById('raceGrid');
  g.innerHTML = races.map(r => `<button class="race-btn${r.id===selectedRace.id?' active':''}" onclick="selectRace('${r.id}')">
    <span class="emoji">${r.emoji}</span><span class="name">${r.name}</span>
  </button>`).join('');
}

function selectRace(id){
  selectedRace = races.find(r=>r.id===id);
  renderRaces();
  generate();
}

function generate(){
  const gender = document.getElementById('gender').value;
  const count = parseInt(document.getElementById('count').value);
  const r = selectedRace;
  let pool = [];
  if(gender==='male') pool = [...r.m];
  else if(gender==='female') pool = [...r.f];
  else pool = [...r.m,...r.f];
  
  const names = [];
  const used = new Set();
  while(names.length < Math.min(count, pool.length)){
    const n = pool[Math.floor(Math.random()*pool.length)];
    if(!used.has(n)){used.add(n);names.push(n);}
  }
  
  const g = document.getElementById('namesGrid');
  g.innerHTML = names.map(name => {
    const meaning = r.meanings[Math.floor(Math.random()*r.meanings.length)];
    return `<div class="name-card" onclick="copyName('${name}')">
      <div class="name">${name}</div>
      <div class="meaning">"${meaning}"</div>
      <div class="copy-hint">Click to copy</div>
    </div>`;
  }).join('');
}

function copyName(name){
  navigator.clipboard.writeText(name);
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

renderRaces();
generate();
</script>
</body>
</html>
