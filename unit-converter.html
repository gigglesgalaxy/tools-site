<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — GigglesGalaxy Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;--accent:#6c63ff;--text:#e8e8f0;--muted:#7070a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  header{background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--text);}
  .logo span{color:var(--accent);}
  .back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;}
  .back-btn:hover{color:var(--accent);}
  main{max-width:700px;margin:0 auto;padding:60px 24px;}
  h1{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;margin-bottom:8px;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:32px;}
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:32px;}
  .cat-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;font-family:inherit;color:var(--text);transition:all 0.2s;font-size:0.83rem;}
  .cat-btn:hover,.cat-btn.active{border-color:var(--accent);background:rgba(108,99,255,0.1);color:var(--accent);}
  .cat-btn .icon{font-size:1.5rem;display:block;margin-bottom:5px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px;}
  label{display:block;font-size:0.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;margin-top:20px;}
  .convert-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-top:20px;}
  input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);font-family:inherit;font-size:1rem;outline:none;transition:border-color 0.2s;}
  input:focus{border-color:var(--accent);}
  select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none;margin-bottom:0;}
  .swap-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 12px;color:var(--muted);cursor:pointer;font-size:1.2rem;transition:all 0.2s;height:52px;display:flex;align-items:center;}
  .swap-btn:hover{border-color:var(--accent);color:var(--accent);}
  .result-display{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-top:24px;text-align:center;display:none;}
  .result-display .res{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--accent);}
  .result-display .eq{color:var(--muted);font-size:0.85rem;margin-top:4px;}
  .all-results{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .mini-result{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;font-size:0.83rem;}
  .mini-result .u{color:var(--muted);}
  .mini-result .v{font-weight:600;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Giggles<span>Galaxy</span> Tools</a>
  <a class="back-btn" href="index.html">← All Tools</a>
</header>
<main>
  <h1>📏 Unit <span>Converter</span></h1>
  <p class="subtitle">Convert length, weight, temperature, speed and more</p>

  <div class="cat-grid" id="catGrid"></div>
  <div class="card" id="converterCard"></div>
</main>
<script>
const categories = {
  Length:{icon:'📏',units:{Meter:1,Kilometer:0.001,Centimeter:100,Millimeter:1000,Mile:0.000621371,Yard:1.09361,Foot:3.28084,Inch:39.3701,'Nautical Mile':0.000539957}},
  Weight:{icon:'⚖️',units:{Kilogram:1,Gram:1000,Pound:2.20462,Ounce:35.274,Ton:0.001,'Stone':0.157473,Milligram:1e6}},
  Temperature:{icon:'🌡️',special:true,units:['Celsius','Fahrenheit','Kelvin']},
  Speed:{icon:'🚀',units:{'m/s':1,'km/h':3.6,'mph':2.23694,'knot':1.94384,'ft/s':3.28084}},
  Area:{icon:'🏠',units:{'Square Meter':1,'Square Kilometer':1e-6,'Square Mile':3.861e-7,'Square Foot':10.7639,'Acre':0.000247105,'Hectare':0.0001,'Square Inch':1550}},
  Volume:{icon:'💧',units:{Liter:1,Milliliter:1000,'Cubic Meter':0.001,Gallon:0.264172,'Fluid Ounce':33.814,Cup:4.22675,Tablespoon:67.628,Teaspoon:202.884}},
  Data:{icon:'💾',units:{Byte:1,Kilobyte:0.001,Megabyte:1e-6,Gigabyte:1e-9,Terabyte:1e-12,Bit:8,'Kibibyte':1/1024,'Mebibyte':1/1048576}},
  Time:{icon:'⏱️',units:{Second:1,Minute:1/60,Hour:1/3600,Day:1/86400,Week:1/604800,Month:1/2629800,Year:1/31557600,Millisecond:1000}},
};

let activeCat = 'Length';

document.getElementById('catGrid').innerHTML = Object.entries(categories).map(([name,cat])=>
  `<button class="cat-btn${name===activeCat?' active':''}" onclick="selectCat('${name}',this)"><span class="icon">${cat.icon}</span>${name}</button>`
).join('');

function selectCat(name,btn){
  activeCat=name;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderConverter();
}

function renderConverter(){
  const cat=categories[activeCat];
  const units=cat.special?cat.units:Object.keys(cat.units);
  const opts=units.map(u=>`<option value="${u}">${u}</option>`).join('');
  document.getElementById('converterCard').innerHTML=`
    <label>From</label>
    <select id="fromUnit" onchange="convert()">${opts}</select>
    <label>To</label>
    <select id="toUnit" onchange="convert()">${opts.replace('<option','<option').replace('value="'+units[0]+'"','value="'+units[Math.min(1,units.length-1)]+'" selected')}</select>
    <label style="margin-top:20px">Value</label>
    <input type="number" id="fromVal" placeholder="Enter value" oninput="convert()" value="1">
    <div class="result-display" id="resultDisplay">
      <div class="res" id="resultVal">--</div>
      <div class="eq" id="resultEq"></div>
    </div>
    ${!cat.special?'<div class="all-results" id="allResults"></div>':''}
  `;
  convert();
}

function convert(){
  const val=parseFloat(document.getElementById('fromVal').value);
  if(isNaN(val))return;
  const from=document.getElementById('fromUnit').value;
  const to=document.getElementById('toUnit').value;
  const cat=categories[activeCat];
  let result;

  if(cat.special){
    if(from==='Celsius'&&to==='Fahrenheit') result=val*9/5+32;
    else if(from==='Fahrenheit'&&to==='Celsius') result=(val-32)*5/9;
    else if(from==='Celsius'&&to==='Kelvin') result=val+273.15;
    else if(from==='Kelvin'&&to==='Celsius') result=val-273.15;
    else if(from==='Fahrenheit'&&to==='Kelvin') result=(val-32)*5/9+273.15;
    else if(from==='Kelvin'&&to==='Fahrenheit') result=(val-273.15)*9/5+32;
    else result=val;
  } else {
    const base=val/cat.units[from];
    result=base*cat.units[to];
  }

  const fmt=n=>parseFloat(n.toPrecision(8)).toLocaleString('en',{maximumFractionDigits:8});
  document.getElementById('resultVal').textContent=fmt(result)+' '+to;
  document.getElementById('resultEq').textContent=`${val} ${from} = ${fmt(result)} ${to}`;
  document.getElementById('resultDisplay').style.display='block';

  // All conversions
  if(!cat.special && document.getElementById('allResults')){
    const base=val/cat.units[from];
    document.getElementById('allResults').innerHTML=Object.entries(cat.units).map(([u,r])=>
      `<div class="mini-result"><span class="u">${u}</span><span class="v">${fmt(base*r)}</span></div>`
    ).join('');
  }
}

renderConverter();
</script>
</body></html>
