<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greek Mythology Names — GigglesGalaxy Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;--accent:#f59e0b;--accent2:#6c63ff;--text:#e8e8f0;--muted:#7070a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 60% 10%,rgba(245,158,11,0.07) 0%,transparent 60%);pointer-events:none;}
  header{background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--text);}
  .logo span{color:var(--accent2);}
  .back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;transition:color 0.2s;}
  .back-btn:hover{color:var(--accent);}
  main{max-width:900px;margin:0 auto;padding:60px 24px;position:relative;z-index:1;}
  h1{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;margin-bottom:8px;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:40px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;}
  .tab{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 18px;cursor:pointer;font-family:inherit;font-size:0.85rem;color:var(--text);transition:all 0.2s;}
  .tab:hover,.tab.active{border-color:var(--accent);background:rgba(245,158,11,0.1);color:var(--accent);}
  .search-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
  .search-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none;min-width:200px;}
  .search-input:focus{border-color:var(--accent);}
  .gen-btn{background:linear-gradient(135deg,var(--accent),#f97316);border:none;border-radius:12px;padding:12px 24px;color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;transition:transform 0.15s;}
  .gen-btn:hover{transform:translateY(-2px);}
  .deity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .deity-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;transition:all 0.2s;cursor:pointer;}
  .deity-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,0.4);}
  .deity-header{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .deity-emoji{font-size:2rem;}
  .deity-name{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;}
  .deity-role{color:var(--accent);font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}
  .deity-desc{color:var(--muted);font-size:0.83rem;line-height:1.6;}
  .deity-domain{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .domain-tag{background:rgba(245,158,11,0.1);color:var(--accent);border-radius:6px;padding:3px 10px;font-size:0.72rem;}
  .count-badge{background:rgba(108,99,255,0.1);color:var(--accent2);border-radius:6px;padding:4px 12px;font-size:0.8rem;margin-bottom:20px;display:inline-block;}
  .copied-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;font-weight:600;padding:10px 24px;border-radius:50px;font-size:0.9rem;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;}
  .copied-toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Giggles<span>Galaxy</span> Tools</a>
  <a class="back-btn" href="index.html">← All Tools</a>
</header>
<main>
  <h1>⚡ Greek <span>Mythology Names</span></h1>
  <p class="subtitle">Explore gods, titans, heroes and mythical creatures of ancient Greece</p>

  <div class="tabs" id="tabs"></div>
  <div class="search-row">
    <input class="search-input" id="searchInput" placeholder="Search names, domains..." oninput="renderCards()">
    <button class="gen-btn" onclick="generateRandom()">🎲 Random 6</button>
  </div>
  <div class="count-badge" id="countBadge"></div>
  <div class="deity-grid" id="grid"></div>
</main>
<div class="copied-toast" id="toast">✓ Name copied!</div>

<script>
const data = {
  'Olympians':[
    {name:'Zeus',emoji:'⚡',role:'King of Gods',desc:'Ruler of Mount Olympus and god of the sky, thunder, lightning, law, order and justice.',domains:['Sky','Thunder','Law','Justice']},
    {name:'Hera',emoji:'👑',role:'Queen of Gods',desc:'Goddess of marriage, women, childbirth and family. Wife and sister of Zeus.',domains:['Marriage','Family','Women']},
    {name:'Poseidon',emoji:'🔱',role:'God of the Sea',desc:'Ruler of seas, earthquakes and horses. Brother of Zeus and Hades.',domains:['Sea','Earthquakes','Horses']},
    {name:'Demeter',emoji:'🌾',role:'Goddess of Harvest',desc:'Goddess of the harvest, grain, agriculture and the seasons.',domains:['Harvest','Agriculture','Seasons']},
    {name:'Athena',emoji:'🦉',role:'Goddess of Wisdom',desc:'Goddess of wisdom, warfare, crafts and strategic battle. Born from Zeus\'s head.',domains:['Wisdom','Warfare','Crafts']},
    {name:'Apollo',emoji:'☀️',role:'God of the Sun',desc:'God of the sun, music, poetry, art, archery, plague, truth and healing.',domains:['Sun','Music','Poetry','Healing']},
    {name:'Artemis',emoji:'🌙',role:'Goddess of the Hunt',desc:'Goddess of the hunt, wilderness, moon and chastity. Twin sister of Apollo.',domains:['Hunt','Moon','Wilderness']},
    {name:'Ares',emoji:'⚔️',role:'God of War',desc:'God of war, bloodlust, violence and manly valor. Son of Zeus and Hera.',domains:['War','Violence','Courage']},
    {name:'Aphrodite',emoji:'💕',role:'Goddess of Love',desc:'Goddess of love, beauty, pleasure, passion and procreation.',domains:['Love','Beauty','Desire']},
    {name:'Hephaestus',emoji:'🔨',role:'God of Fire',desc:'God of fire, smithery, crafts and volcanoes. The divine blacksmith.',domains:['Fire','Smithery','Crafts']},
    {name:'Hermes',emoji:'🪄',role:'Messenger of Gods',desc:'Messenger god, patron of travelers, thieves, and commerce. Guide of souls.',domains:['Commerce','Travel','Thieves','Messengers']},
    {name:'Dionysus',emoji:'🍷',role:'God of Wine',desc:'God of wine, vegetation, pleasure, festivity, madness and wild frenzy.',domains:['Wine','Festivity','Madness','Theatre']},
  ],
  'Titans':[
    {name:'Cronus',emoji:'⏳',role:'Titan of Time',desc:'Ruler of the Titans and god of time and the harvest. Father of the Olympians.',domains:['Time','Harvest','Fate']},
    {name:'Rhea',emoji:'🌍',role:'Titan of Generation',desc:'Titaness of generation, motherhood and the flow of time.',domains:['Motherhood','Generation','Earth']},
    {name:'Oceanus',emoji:'🌊',role:'Titan of the Ocean',desc:'Titan personifying the sea-ocean that encircled the world.',domains:['Ocean','Rivers','Water']},
    {name:'Hyperion',emoji:'🌟',role:'Titan of Light',desc:'Titan of light, father of the sun Helios, moon Selene and dawn Eos.',domains:['Light','Sun','Moon','Dawn']},
    {name:'Prometheus',emoji:'🔥',role:'Titan of Forethought',desc:'Titan who stole fire from the gods and gave it to humanity.',domains:['Fire','Forethought','Craftsmanship']},
    {name:'Atlas',emoji:'🌐',role:'Titan of Endurance',desc:'Titan condemned to hold up the heavens on his shoulders for eternity.',domains:['Endurance','Astronomy','Navigation']},
    {name:'Themis',emoji:'⚖️',role:'Titan of Law',desc:'Titaness of divine law, order and custom. Personification of justice.',domains:['Law','Order','Justice','Prophecy']},
    {name:'Mnemosyne',emoji:'📚',role:'Titan of Memory',desc:'Titaness of memory, remembrance and the inventor of language.',domains:['Memory','Language','Time']},
  ],
  'Heroes':[
    {name:'Heracles',emoji:'💪',role:'Greatest Hero',desc:'Son of Zeus, famous for his extraordinary strength and the Twelve Labors.',domains:['Strength','Labor','Protection']},
    {name:'Achilles',emoji:'🏹',role:'Hero of Troy',desc:'Greatest Greek warrior of the Trojan War, nearly invulnerable except his heel.',domains:['War','Strength','Honor']},
    {name:'Odysseus',emoji:'🚢',role:'King of Ithaca',desc:'Hero famed for his intelligence and cunning. Protagonist of Homer\'s Odyssey.',domains:['Cunning','Navigation','Wisdom']},
    {name:'Perseus',emoji:'🗡️',role:'Slayer of Medusa',desc:'Hero who slew the Gorgon Medusa and rescued Andromeda from a sea monster.',domains:['Heroism','Monster-slaying','Destiny']},
    {name:'Theseus',emoji:'🐂',role:'King of Athens',desc:'Founder-king of Athens who slew the Minotaur in the Labyrinth of Crete.',domains:['Heroism','Justice','Athens']},
    {name:'Jason',emoji:'🐏',role:'Leader of Argonauts',desc:'Led the Argonauts in the quest for the Golden Fleece.',domains:['Adventure','Leadership','Quest']},
    {name:'Orpheus',emoji:'🎵',role:'Musician',desc:'Legendary musician whose music could charm all living things.',domains:['Music','Poetry','Love']},
    {name:'Bellerophon',emoji:'🐎',role:'Tamer of Pegasus',desc:'Hero who tamed Pegasus and slew the Chimera.',domains:['Pegasus','Heroism','Flight']},
  ],
  'Creatures':[
    {name:'Medusa',emoji:'🐍',role:'Gorgon',desc:'One of three Gorgon sisters whose gaze turned onlookers to stone.',domains:['Stone','Fear','Death']},
    {name:'Minotaur',emoji:'🐃',role:'Bull-Man Monster',desc:'Half-human, half-bull creature imprisoned in the Cretan Labyrinth.',domains:['Labyrinth','Terror','Crete']},
    {name:'Cerberus',emoji:'🐕',role:'Hound of Hades',desc:'The three-headed dog that guards the entrance to the Underworld.',domains:['Underworld','Guard','Death']},
    {name:'Pegasus',emoji:'🐎',role:'Winged Horse',desc:'Immortal winged horse that sprang from Medusa\'s blood.',domains:['Flight','Speed','Thunder']},
    {name:'Sphinx',emoji:'🦁',role:'Riddler',desc:'Winged lion with a human head that devoured those who couldn\'t answer its riddle.',domains:['Riddles','Death','Mystery']},
    {name:'Chimera',emoji:'🐲',role:'Fire-Breathing Beast',desc:'Fire-breathing monster with lion head, goat body and serpent tail.',domains:['Fire','Terror','Destruction']},
    {name:'Hydra',emoji:'🐉',role:'Multi-Headed Serpent',desc:'Serpentine water monster with multiple heads that regenerated when cut off.',domains:['Water','Regeneration','Poison']},
    {name:'Cyclops',emoji:'👁️',role:'One-Eyed Giant',desc:'Giants with a single eye, master smiths who forged Zeus\'s thunderbolts.',domains:['Smithery','Strength','Thunder']},
  ],
};

let activeTab = 'Olympians';
let showing = null;

function renderTabs(){
  document.getElementById('tabs').innerHTML = Object.keys(data).map(t=>
    `<button class="tab${t===activeTab?' active':''}" onclick="setTab('${t}')">${t} (${data[t].length})</button>`
  ).join('');
}
function setTab(t){activeTab=t;showing=null;renderTabs();renderCards();}

function renderCards(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const pool = showing || data[activeTab];
  const filtered = pool.filter(d =>
    d.name.toLowerCase().includes(q) ||
    d.desc.toLowerCase().includes(q) ||
    d.domains.some(dm=>dm.toLowerCase().includes(q))
  );
  document.getElementById('countBadge').textContent = `${filtered.length} names found`;
  document.getElementById('grid').innerHTML = filtered.map(d=>`
    <div class="deity-card" onclick="copyDeity('${d.name}')">
      <div class="deity-header">
        <div class="deity-emoji">${d.emoji}</div>
        <div><div class="deity-name">${d.name}</div><div class="deity-role">${d.role}</div></div>
      </div>
      <div class="deity-desc">${d.desc}</div>
      <div class="deity-domain">${d.domains.map(dm=>`<span class="domain-tag">${dm}</span>`).join('')}</div>
    </div>
  `).join('') || '<p style="color:var(--muted);grid-column:1/-1">No results found.</p>';
}

function generateRandom(){
  const all = Object.values(data).flat();
  const shuffled = all.sort(()=>Math.random()-0.5).slice(0,6);
  showing = shuffled;
  activeTab = '';
  renderTabs();
  renderCards();
}

function copyDeity(name){
  navigator.clipboard.writeText(name);
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

renderTabs(); renderCards();
</script>
</body>
</html>
