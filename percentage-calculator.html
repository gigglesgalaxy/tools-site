<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage Calculator — GigglesGalaxy Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;--accent:#6c63ff;--text:#e8e8f0;--muted:#7070a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  header{background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--text);}
  .logo span{color:var(--accent);}
  .back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;}
  .back-btn:hover{color:var(--accent);}
  main{max-width:700px;margin:0 auto;padding:60px 24px;}
  h1{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;margin-bottom:8px;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:40px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:20px;}
  .card h2{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:20px;color:var(--accent);}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  input[type=number]{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:1rem;outline:none;width:120px;transition:border-color 0.2s;}
  input[type=number]:focus{border-color:var(--accent);}
  .eq{color:var(--muted);font-size:1.1rem;}
  .btn{background:linear-gradient(135deg,var(--accent),#a855f7);border:none;border-radius:10px;padding:12px 24px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;font-size:0.9rem;transition:transform 0.15s;}
  .btn:hover{transform:translateY(-2px);}
  .answer{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:inline-flex;align-items:center;gap:12px;margin-top:12px;}
  .answer .val{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--accent);}
  .answer .label{color:var(--muted);font-size:0.85rem;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Giggles<span>Galaxy</span> Tools</a>
  <a class="back-btn" href="index.html">← All Tools</a>
</header>
<main>
  <h1>💯 Percentage <span>Calculator</span></h1>
  <p class="subtitle">Calculate percentages in every possible way</p>

  <div class="card">
    <h2>What is X% of Y?</h2>
    <div class="row">
      <input type="number" id="p1a" placeholder="25">
      <span class="eq">% of</span>
      <input type="number" id="p1b" placeholder="200">
      <button class="btn" onclick="calc1()">= ?</button>
    </div>
    <div class="answer" id="ans1" style="display:none"><span class="val" id="v1"></span><span class="label">result</span></div>
  </div>

  <div class="card">
    <h2>X is what % of Y?</h2>
    <div class="row">
      <input type="number" id="p2a" placeholder="50">
      <span class="eq">is what % of</span>
      <input type="number" id="p2b" placeholder="200">
      <button class="btn" onclick="calc2()">= ?</button>
    </div>
    <div class="answer" id="ans2" style="display:none"><span class="val" id="v2"></span><span class="label">%</span></div>
  </div>

  <div class="card">
    <h2>Percentage Change (from X to Y)</h2>
    <div class="row">
      <span class="eq">From</span>
      <input type="number" id="p3a" placeholder="100">
      <span class="eq">to</span>
      <input type="number" id="p3b" placeholder="150">
      <button class="btn" onclick="calc3()">= ?</button>
    </div>
    <div class="answer" id="ans3" style="display:none"><span class="val" id="v3"></span><span class="label" id="v3l">% increase</span></div>
  </div>

  <div class="card">
    <h2>X% increase/decrease of Y</h2>
    <div class="row">
      <input type="number" id="p4a" placeholder="20">
      <span class="eq">% </span>
      <select id="p4op" style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:inherit;outline:none;">
        <option value="inc">increase of</option>
        <option value="dec">decrease of</option>
      </select>
      <input type="number" id="p4b" placeholder="500">
      <button class="btn" onclick="calc4()">= ?</button>
    </div>
    <div class="answer" id="ans4" style="display:none"><span class="val" id="v4"></span><span class="label" id="v4l">result</span></div>
  </div>
</main>
<script>
function calc1(){const a=+document.getElementById('p1a').value,b=+document.getElementById('p1b').value;if(!a||!b)return;document.getElementById('v1').textContent=(a/100*b).toFixed(4).replace(/\.?0+$/,'');document.getElementById('ans1').style.display='inline-flex';}
function calc2(){const a=+document.getElementById('p2a').value,b=+document.getElementById('p2b').value;if(!a||!b)return;document.getElementById('v2').textContent=(a/b*100).toFixed(4).replace(/\.?0+$/,'');document.getElementById('ans2').style.display='inline-flex';}
function calc3(){const a=+document.getElementById('p3a').value,b=+document.getElementById('p3b').value;if(!a||!b)return;const ch=((b-a)/Math.abs(a)*100);document.getElementById('v3').textContent=Math.abs(ch).toFixed(2)+'%';document.getElementById('v3l').textContent=ch>=0?'increase':'decrease';document.getElementById('ans3').style.display='inline-flex';}
function calc4(){const a=+document.getElementById('p4a').value,b=+document.getElementById('p4b').value,op=document.getElementById('p4op').value;if(!a||!b)return;const r=op==='inc'?b*(1+a/100):b*(1-a/100);document.getElementById('v4').textContent=r.toFixed(4).replace(/\.?0+$/,'');document.getElementById('v4l').textContent=op==='inc'?'after increase':'after decrease';document.getElementById('ans4').style.display='inline-flex';}
</script>
</body></html>
